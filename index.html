<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drako Figures – Heavy Metal Goddess</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#111;color:#ffd700}
        header{display:flex;justify-content:space-between;align-items:center;background:#000;padding:1rem}
        nav a{color:#ffd700;margin-left:1rem;text-decoration:none}
        nav a:hover{text-decoration:underline}
        button{background:none;border:none;color:#ffd700;font-size:1rem;cursor:pointer}
        .content{padding:2rem}
        .lang{display:flex;gap:0.5rem}
    </style>
</head>
<body>
    <header>
        <div class="logo">🚀 Drako Figures</div>
        <nav>
            <a href="#home" data-es="Inicio">Home</a>
            <a href="#about" data-es="Acerca">About</a>
            <a href="#contact" data-es="Contacto">Contact</a>
            <div class="lang">
                <button onclick="setLang('es')">ES</button> | <button onclick="setLang('en')">EN</button>
            </div>
        </nav>
    </header>
    <main class="content">
        <section id="home">
            <h1 data-es="¡Drako Heavy Metal Goddess!" data-en="Drako Heavy Metal Goddess!"></h1>
            <p data-es="Descubre la figura definitiva de la diosa del metal." data-en="Discover the ultimate heavy‑metal goddess figure."></p>
        </section>
        <section id="about">
            <h2 data-es="Acerca de" data-en="About"></h2>
            <p data-es="Drako es la nueva sensación en figuras coleccionables de figuras 3D." data-en="Drako is the new sensation in 3D collectible figures."></p>
        </section>
        <section id="contact">
            <h2 data-es="Contacto" data-en="Contact"></h2>
            <p data-es="Ponte en contacto con nosotros para pedidos y consultas." data-en="Get in touch for orders and inquiries."></p>
        </section>
    </main>
    <script>
        const langMap = {es:'es', en:'en'};
        function setLang(lang) {
            document.querySelectorAll('[data-es],[data-en]').forEach(el=>{
                const key = el.getAttribute('data-'+langMap[lang]);
                if (key) el.textContent = key;
            });
            document.documentElement.lang = langMap[lang];
        }
        setLang('es'); // Español por defecto
    </script>
</body>
</html>
